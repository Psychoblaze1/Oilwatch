<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet" />

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

}/*EDITMODE-END*/;
window.__TWEAK_DEFAULTS__ = TWEAK_DEFAULTS;

<style>
  :root {
    --accent: #c2410c;
    --accent-soft: rgba(194,65,12,0.08);
    --accent-line: rgba(194,65,12,0.22);

    --bg: #f5f4f0;
    --bg-elev: #ffffff;
    --bg-sunken: #ecebe6;
    --bg-side: #1c1a17;
    --bg-side-elev: #26231f;

    --line: #e3e0d9;
    --line-strong: #d3cfc5;
    --line-side: #36322c;

    --ink: #1c1a17;
    --ink-2: #4a4640;
    --ink-3: #807a70;
    --ink-4: #a6a097;
    --ink-side: #f5f4f0;
    --ink-side-2: #c8c3b8;
    --ink-side-3: #807a70;

    --ok: #2f7d4f;
    --ok-bg: rgba(47,125,79,0.10);
    --warn: #b88514;
    --warn-bg: rgba(184,133,20,0.12);
    --crit: #b8331f;
    --crit-bg: rgba(184,51,31,0.10);
    --sev: #2a2521;
    --sev-bg: rgba(42,37,33,0.10);

    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --serif: "IBM Plex Serif", Georgia, serif;
  }

  html[data-theme="dark"] {
    --bg: #0e0d0b;
    --bg-elev: #16140f;
    --bg-sunken: #0a0908;
    --bg-side: #0a0908;
    --bg-side-elev: #16140f;

    --line: #2a2620;
    --line-strong: #3a352d;
    --line-side: #1c1914;

    --ink: #f0ece4;
    --ink-2: #c4bfb3;
    --ink-3: #8a857a;
    --ink-4: #5e5a52;
    --ink-side: #f5f4f0;
    --ink-side-2: #b8b3a7;
    --ink-side-3: #6c685e;

    --accent-soft: rgba(255, 122, 60, 0.14);
    --accent-line: rgba(255, 122, 60, 0.30);

    --ok-bg: rgba(72,175,113,0.16);
    --warn-bg: rgba(225,170,55,0.18);
    --crit-bg: rgba(225,90,70,0.16);
    --sev-bg: rgba(245,240,232,0.10);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  .mono { font-family: var(--mono); font-feature-settings: "tnum" 1, "ss01" 1; }
  .num { font-family: var(--mono); font-feature-settings: "tnum" 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

  /* App skeleton hide while React mounts */
  #root:empty::before {
    content: "Oilwatch";
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.15em;
    color: var(--ink-3); text-transform: uppercase;
  }
</style>
</head>

<div id="root"></div>
